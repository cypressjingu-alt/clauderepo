# Source registry.
#
# A pool file's source is its second folder level, e.g. music/<genre>/<source>/file.mp3.
# Files from a source that isn't listed here with compilation_ok: true are ingested but
# never used. Only register a source after reading its terms page: it must explicitly allow
# music-only, static-image or compilation videos. Creative Commons: CC0 and CC-BY only.
#
# <source-id>:
#   name: Human-readable name (shows up in credits)
#   terms_url: https://...            # the page that allows this format
#   checked: 2026-09-27               # when someone last read those terms
#   license: CC0 | CC-BY 4.0 | <custom license name>
#   compilation_ok: true
#   attribution_required: false
#   credit: "{title} by {artist}"      # placeholders: {title} {artist} {source} {license}

own-recordings:
  name: Cypress
  terms_url: null
  checked: 2026-09-27
  license: Owner's own recording
  compilation_ok: true
  attribution_required: false
  credit: "{title}"

# Dev pool for the M1 listening sign-off (owner-approved list, 2026-09-27).
# CC BY 4.0. The FAQ allows YouTube use, monetized, with this exact credit, and has no restriction on
# music-only or compilation videos, but doesn't name them explicitly either. His catalogue IS registered
# in Content ID (https://incompetech.com/music/royalty-free/youtube-contentid.html): confirm how credited
# uses are treated before publishing anything with these tracks.
incompetech:
  name: incompetech (Kevin MacLeod)
  terms_url: https://incompetech.com/music/royalty-free/faq.html
  checked: 2026-09-27
  license: CC BY 4.0
  compilation_ok: true
  attribution_required: true
  credit: "{title} Kevin MacLeod (incompetech.com) Licensed under Creative Commons: By Attribution 4.0 https://creativecommons.org/licenses/by/4.0/"

# Generated on the desktop with ACE-Step 1.5 (generate/music.py). Code and weights are MIT, and the model card
# allows commercial use of the output. Owner approved the sound, 2026-09-28.
ai-acestep:
  name: ACE-Step 1.5 (AI-generated)
  terms_url: https://huggingface.co/ACE-Step/Ace-Step1.5
  checked: 2026-09-28
  license: AI-generated (ACE-Step 1.5, MIT)
  compilation_ok: true
  attribution_required: false
  ai_generated: true     # for YouTube's disclosure step (M3)
  credit: "{title}"

# Freesound licenses per sound. Only CC0 1.0 sounds go in freesound-cc0/ folders (these are the public HQ previews).
freesound-cc0:
  name: Freesound
  terms_url: https://creativecommons.org/publicdomain/zero/1.0/
  checked: 2026-09-27
  license: CC0 1.0
  compilation_ok: true
  attribution_required: false
  credit: "{title} by {artist} (Freesound, CC0)"

# Wikimedia Commons licenses per file. Only CC0 1.0 files go in wikimedia-cc0/ folders.
wikimedia-cc0:
  name: Wikimedia Commons
  terms_url: https://creativecommons.org/publicdomain/zero/1.0/
  checked: 2026-09-27
  license: CC0 1.0
  compilation_ok: true
  attribution_required: false
  credit: "{title} by {artist} (Wikimedia Commons, CC0)"
