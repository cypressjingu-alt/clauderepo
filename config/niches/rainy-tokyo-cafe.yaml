id: rainy-tokyo-cafe
name: Rainy Tokyo Café
format: layered
music: [jazz, lofi]
ambience:
  bed: rain
  bed_level_db: -16          # relative to the music
  events:
    - { type: cafe-cups, every: [40s, 150s], gain_db: [-18, -8] }
    - { type: distant-thunder, every: [120s, 480s], gain_db: [-14, -6], flash: true }
visual: tokyo-night
motion: effects
effects: { flicker: 0.015 }   # warm light breathing (rain lives in the image and the sound)
length: [1h15m, 1h45m]     # owner: 1 h minimum, 1 h 30 ideal
loudness: -16              # jazz: see lobby-jazz
weight: 3
metadata:
  search: rainy tokyo cafe jazz ambience
  scene: a cozy Tokyo cafe on a rainy night, lanterns and neon reflected on wet streets
  audience: study, work, relaxing on a rainy evening
thumbnail: { font: "C:/Windows/Fonts/segoeuib.ttf", colors: ["#ffe9f3", "#1b0f24"] }
