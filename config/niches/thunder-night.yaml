id: thunder-night
name: Thunderstorm Night
format: ambience
ambience:
  bed: rain
  events:
    # gain_db is relative to the program loudness; flash: true adds lightning ~1.5 s before each thunder
    - { type: distant-thunder, every: [120s, 480s], gain_db: [-6, 2], flash: true }
visual: storm-window
motion: effects
effects: { sky: 0.5 }      # clouds drift across the top half (rain lives in the image and the sound)
length: [8h, 10h]
loudness: -24              # sleep ambience; rain's sharp drop transients sit ~28 dB above its loudness, so -20 needs heavy limiting
weight: 2
thumbnail: { font: "C:/Windows/Fonts/segoeuib.ttf", colors: ["#dfe7f2", "#05070d"] }
